<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        rel="stylesheet" href="styles.css">
    <title>Interfaz</title>
</head>
<body>
    <h1>Gestor de Contactos</h1>

    <h2>Agregar contacto</h2>

    <!-- formulario -->
<form method="POST">

<div class="formulario">
<label>Nombre</label>
<input type="text" name="nombre" required placeholder="Pepito Perez">

<label>Teléfono</label>
<input type="number" name="telefono" required placeholder="3451027122">

<label>Correo</label>
<input type="email" name="correo" required placeholder="pepito_perez@example.com">

<label>Dirección</label>
<input type="text" name="direccion" required placeholder="Cll 123 # 45 - 67">
</div>

<button type="submit">
    Agregar contacto
</button>

</form>
</body>
</html>
